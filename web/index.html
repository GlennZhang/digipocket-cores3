<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigiPocket · 暴龙机</title><link rel="stylesheet" href="style.css"></head><body><main><section class="device" aria-label="CoreS3 暴龙机预览"><canvas id="device" width="320" height="240" aria-label="320×240 暴龙机屏幕"></canvas><div class="keys"><button id="key-a" aria-label="A 选择或切换"><span>A</span></button><button id="key-b" aria-label="B 确认"><span>B</span></button><button id="key-c" aria-label="C 返回"><span>C</span></button></div></section><nav class="game-links" aria-label="游戏工具"><button id="open-play" type="button">扩展菜单</button><a id="evolution-chart" href="进化路线图.html" target="_blank" rel="noopener">进化路线与条件</a></nav><p id="hint" aria-live="polite"></p><p class="help">A 选择 · B 确认 · C 返回 <span>键盘 A / B / C 或 ← / Enter / Esc</span></p><details><summary>操作说明</summary><p>八个图标依次为：状态、喂食、训练、对战、照料、图鉴、进化、设置。先按 A 选择图标，再按 B 进入。设置中 A 切换选项，B 修改，C 返回。图鉴中长按 A 快进 50 项，B 查看资料，图鉴不能直接领养。照料中选择 NEW EGG 开始新养成；主画面长按 A 或点击「扩展菜单」进入背包、商店、伙伴栏、合体与离线副本。</p><p>与 CoreS3 使用相同的 320×240 布局；右侧只有三个触摸按钮。不复刻外壳。</p></details></main><script type="module" src="app.js"></script></body></html>
